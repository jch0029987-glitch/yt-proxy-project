name: Build Roku and Android
on:
  push:
    branches: [ main ]

jobs:
  # Job 1: Build the Roku Zip
  build-roku:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Roku Package
        run: |
          cd roku-app
          zip -r ../roku-app-release.zip .
          
      - name: Upload Roku Zip
        uses: actions/upload-artifact@v4
        with:
          name: Roku-App-Package
          path: roku-app-release.zip

  # Job 2: Build the Android APK
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: |
          cd android-app
          npm install

      - name: Bundle JavaScript Assets
        run: |
          cd android-app
          # Create the assets folder if it doesn't exist
          mkdir -p android/app/src/main/assets
          
          # Bundle the JS so the app works offline
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: Build Android Debug APK
        run: |
          cd android-app/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-Debug-APK
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
